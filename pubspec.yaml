name: panaderia_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.2+12

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Textos de los widgets de Material que NO escribimos nosotros (selector
  # de fecha/hora, "Cancel"/"OK", tooltips de la AppBar, menú de copiar y
  # pegar…). Sin esto la app arranca en inglés aunque todo lo nuestro esté
  # en español — reportado sobre el calendario del tablero. Viene con el
  # SDK de Flutter, no se descarga de pub.dev.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Set de íconos profesional (reemplaza a Icons.* de Material en toda la
  # app): 6 variantes de grosor por ícono (thin/light/regular/bold/fill/
  # duotone), usadas para diferenciar estado normal vs. activo/hover.
  phosphor_flutter: ^2.1.0

  # Animaciones fluidas y modernas para transiciones y micro-interacciones.
  flutter_animate: ^4.5.2

  # Cliente HTTP para hablar con el backend Node/Express.
  http: ^1.2.2

  # Almacenamiento cifrado (Android Keystore / iOS Keychain) para tokens JWT.
  flutter_secure_storage: ^9.2.2

  # Autenticación biométrica (huella / rostro) del dispositivo.
  local_auth: ^2.3.0

  # Monetización con banners de Google AdMob.
  google_mobile_ads: ^9.0.0

  # Abrir marcador telefónico, WhatsApp y Google Maps desde la app.
  url_launcher: ^6.3.1

  # Leer la versión/build instalada del propio APK, para compararla contra
  # la versión mínima que exige el backend (ver VersionService).
  package_info_plus: ^8.1.2

  # Compartir contacto mediante el módulo nativo de compartir del sistema.
  share_plus: ^10.1.2

  # Formateo de fechas (fecha/hora de entrega de pedidos).
  intl: ^0.20.2

  # Ubicación GPS de alta precisión para geolocalizar direcciones de entrega.
  geolocator: ^13.0.2

  # Traduce coordenadas GPS a una dirección física legible (geocodificación
  # inversa) y viceversa.
  geocoding: ^3.0.0

  # Notificaciones push reales (Firebase Cloud Messaging).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # FCM no muestra la notificación del sistema si la app está en primer
  # plano — esto la muestra igual en ese caso.
  flutter_local_notifications: ^18.0.1

  # Generar el QR informativo de pago (monto + referencia + datos del
  # medio de pago) para que el cliente lo escanee con cualquier billetera.
  qr_flutter: ^4.1.0

  # Gráficos animados (barras, etc.) para el dashboard de administración.
  fl_chart: ^0.69.2

  # Elegir de galería/cámara el QR real (descargado de la app de Yape/Plin)
  # al registrar un método de pago.
  image_picker: ^1.1.2

  # Reproduce los clips cortos en loop de la mascota (panadero 3D animado)
  # en el splash y el login — assets/mascota/, ver MascotaVideo.
  video_player: ^2.9.5

  # `AnimatedSampler`: aplica un fragment shader al contenido de un widget
  # que se redibuja en cada frame (la textura del video de la mascota). Es
  # lo que permite recomponer el canal alfa empaquetado en el MP4 y que el
  # panadero salga con transparencia real en vez de con un rectángulo de
  # fondo. Ver MascotaVideo y shaders/mascota_alfa.frag.
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Genera el ícono nativo (launcher) para Android/iOS a partir de un solo
  # PNG maestro — se corre una vez con `dart run flutter_launcher_icons`,
  # no se usa en tiempo de ejecución de la app.
  flutter_launcher_icons: ^0.14.3

# Config de flutter_launcher_icons — ícono de Panadería Ronceros (el
# panadero con el pan, ilustración de marca).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFE7CD"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # El maestro ya viene compuesto respetando la zona segura del ícono
  # adaptativo (el panadero ocupa el 76% del alto, con la cabeza y los panes
  # dentro del 66% central). El inset del 16% que aplica el paquete por
  # defecto se sumaba a ese margen y dejaba al personaje chico dentro del
  # ícono, así que acá se anula.
  adaptive_icon_foreground_inset: 0
  # Antes solo se generaba para Android/iOS — la versión Web se quedó con
  # el favicon y los íconos de PWA por defecto de Flutter (se notaba en la
  # pestaña del navegador).
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFE7CD"
    theme_color: "#FFE7CD"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # El mismo maestro que usa flutter_launcher_icons para generar el ícono
  # de la app — se reusa también dentro de la UI (login, splash) para que
  # el panadero aparezca igual en todos lados, sin duplicar el archivo.
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_foreground.png
    - assets/mascota/panadero_reposo.mp4
    - assets/mascota/panadero_saludo.mp4
    # Silueta desenfocada del personaje: se pinta detrás del video para
    # darle separación del fondo crema (el uniforme blanco casi no
    # contrastaba). Generada desde el mismo matte alfa de los clips.
    - assets/mascota/sombra_panadero.png
    - assets/mascota/sombra_panadero_saludo.png

  # Recompone el canal alfa que viene empaquetado dentro del MP4 de la
  # mascota, para que el panadero se dibuje con transparencia real.
  shaders:
    - shaders/mascota_alfa.frag

  # Sin esto, Flutter Web (CanvasKit) usa la fuente por defecto (Roboto)
  # descargándola de la red recién al pintar el primer texto. Empaquetar
  # la fuente acá la deja disponible localmente desde el primer frame.
  #
  # Un solo .ttf VARIABLE mapeado a varios `weight:` (probado primero, más
  # liviano) renderizaba con la descendente de la "p" recortada en pesos
  # bold — confirmado con capturas a pantalla completamente asentada, no
  # era un problema de timing de carga. CanvasKit no resuelve bien el eje
  # de peso de una fuente variable cuando se registra la misma más de una
  # vez con `weight:` distinto. Un archivo .ttf ESTÁTICO real por peso
  # (generado con `fonttools varLib.instancer` desde la variable de
  # Google Fonts) rinde correctamente. Mismo criterio visual que ya usa
  # pagina-web/ para Inter, así la marca se ve igual en los dos lugares.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
