name: Keep-alive backend + base de datos 24-7

# Evita el "arranque en frío" de ~2 minutos al loguearse: Render duerme el
# servicio gratuito tras 15 min sin tráfico, y Azure SQL (oferta gratuita)
# pausa la base de datos por su cuenta tras un rato de inactividad — ninguno
# de los dos se puede desactivar directamente en el nivel gratuito. Este
# ping cada 10 minutos, 24/7, mantiene ambos despiertos sin depender de que
# nadie tenga la app abierta.
#
# Reemplaza a keep-alive.yml (mismo propósito, nombre de archivo distinto):
# ese workflow se quedó con el disparador `schedule` sin registrar del lado
# de GitHub — quedó como `state: active` pero nunca ejecutó una sola vez
# por cron, ni siquiera tras reescribir el archivo y volver a subirlo. Un
# workflow con un id nuevo evita lo que sea que se atascó en el anterior.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/keep-alive
        run: |
          curl -sS --max-time 90 --retry 2 --retry-delay 5 \
            "https://panaderia-backend-vtdy.onrender.com/api/keep-alive"
