name: Keep-alive backend + ML 24-7

# Evita el "arranque en frío" (~2 min el backend, ~1 min el microservicio
# de ML) al usar la app: Render duerme cada servicio gratuito tras 15 min
# sin tráfico, y eso no se puede desactivar directamente en el nivel
# gratuito.
#
# Costo real de esto: las 750 horas gratis de Render son por workspace, no
# por servicio — dos servicios despiertos 24/7 sí pueden agotarlas antes de
# fin de mes (~1,440-1,488 horas combinadas contra 750 disponibles). Es una
# decisión consciente del negocio (evitar la espera en vez de ahorrar
# horas); si vuelve a pasar lo de la suspensión, la solución real es pasar
# el backend a un plan pago (Starter, ~$7/mes) para sacarlo del pool
# gratuito, no quitar este ping.
#
# NO alcanza con "un ping cada 10 min" via `schedule`: se probó (ver
# historial de este mismo workflow, y antes en keep-alive.yml) y GitHub NO
# cumple ese intervalo — un cron de cada 10 min terminó disparando con
# gaps reales de 43 a 462 minutos, muy por encima del umbral de sueño de
# Render (documentado por GitHub: los schedules frecuentes se retrasan o
# se descartan bajo carga, sin garantía de horario). Por eso cada corrida
# de este job hace su PROPIO loop de ping cada ~9 min durante ~5h50 (bien
# por debajo del límite duro de 360 min por job de GitHub Actions) en vez
# de confiar en que el disparador externo llegue a tiempo. El repo es
# público, así que estos minutos de Actions no cuestan nada.
#
# `concurrency` con `cancel-in-progress: false` encadena las corridas sin
# solaparlas: si ya hay un loop activo, un disparo nuevo se encola y
# arranca apenas termine el anterior — así el schedule (cada 20 min, como
# red de respaldo) solo necesita acertar UNA vez dentro de esas ~5h50 para
# que la cadena nunca se corte, en vez de necesitar acertar cada 10 min.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-alive-24-7
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping ambos servicios cada ~9 min por ~5h50
        run: |
          fin=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            echo "=== $(date -u +%H:%M:%S) UTC ==="
            curl -sS --max-time 90 --retry 2 --retry-delay 5 \
              "https://panaderia-backend-vtdy.onrender.com/api/keep-alive" || true
            echo
            curl -sS --max-time 90 --retry 2 --retry-delay 5 \
              "https://panaderia-ml-service.onrender.com/salud" || true
            echo
            sleep 540
          done
